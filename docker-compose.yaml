services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: CivicAI-frontend
    ports:
      - "4173:4173"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: CivicAI-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - bot

  bot:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: CivicAI-bot
    ports:
      - "8000:8000"
    env_file:
      - ./chatbot/.env

volumes:
  mongodb_data: