services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: CivicAI-frontend
    ports:
      - "4173:4173"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: CivicAI-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env

  redis:
    image: redis:7-alpine
    container_name: chai-aur-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  redis-data: